<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
<meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14140f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%238c3b22'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' fill='%23faf9f6' text-anchor='middle'%3END%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<script>
  /* Apply a saved theme before first paint so there's no flash. */
  try {
    var t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
